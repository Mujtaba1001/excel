<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel Builder</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>📊 Excel Builder</h1>
      <button onclick="$('file').click()">📂 Open Excel file</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden />
      <button onclick="clearAll()">Clear all</button
      ><button class="p" onclick="save()">Save as Excel</button>
    </header>
    <main>
      <section id="L">
        <h2><span>Your data</span></h2>
        <div class="body" id="cards"></div>
        <div style="padding: 0 12px 12px">
          <button class="p" style="width: 100%" onclick="addField()">+ Add new heading</button>
        </div>
      </section>
      <section id="R">
        <h2>
          <span>Excel preview (live)</span>
          <div class="tg">
            <button id="o0" onclick="setO(0)">Headings across</button
            ><button id="o1" onclick="setO(1)">Headings down</button>
          </div>
        </h2>
        <div id="tb"></div>
        <div id="gw"></div>
        <div id="st">Tip: click or drag over cells to select them, then pick a function.</div>
      </section>
    </main>
    <div id="md">
      <div class="box">
        <p id="mt"></p>
        <div class="bt"><button id="mn"></button><button id="my" class="p"></button></div>
      </div>
    </div>

    <!-- Third-party: SheetJS (bundled locally, works offline) -->
    <script src="vendor/xlsx.full.min.js"></script>
    <!-- Application code (order matters: plain scripts, no bundler needed) -->
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/model.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/events.js"></script>
    <script src="js/export.js"></script>
    <script src="js/import.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
